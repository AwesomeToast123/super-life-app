name: super_life_app
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  go_router: ^17.3.0
  image_picker: ^1.2.3
  video_player: ^2.11.1
  gap: ^3.0.1
  flutter_svg: ^2.3.0
  timer_flutter: ^0.2.3-beta
  circular_countdown_timer: ^0.2.4
  flutter_time_duration_picker: ^0.1.0
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.6
  hive_generator: ^2.0.1



flutter:
  uses-material-design: true

